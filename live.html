<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sounding — live</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sounding" />
    <meta name="theme-color" id="theme-color" content="#f4f2ec" />
    <script>
      // The mood, as on funclosure.xyz: night when the device is in dark mode,
      // otherwise the paper for the hour. Set before first paint; day is the fallback.
      ;(function () {
        var dark = matchMedia('(prefers-color-scheme: dark)')
        function mood() {
          var h = new Date().getHours()
          return dark.matches ? 'dark' : h < 5 || h >= 20 ? 'dusk' : h < 9 ? 'dawn' : h < 16 ? 'day' : 'dusk'
        }
        // the strip behind the clock takes the mood's paper (the --paper values in board.css)
        var PAPER = { dawn: '#f6efee', day: '#f4f2ec', dusk: '#f3ebe2', dark: '#16161b' }
        function apply() {
          var m = mood()
          var c = document.documentElement.classList
          c.remove('dawn', 'day', 'dusk', 'dark')
          c.add(m)
          document.getElementById('theme-color').setAttribute('content', PAPER[m])
        }
        apply()
        dark.addEventListener('change', apply)
      })()
    </script>
    <link rel="stylesheet" href="/src/ui/board/board.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      html {
        background: var(--paper);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--mono);
        transition:
          background-color var(--fade) ease,
          color var(--fade) ease;
      }

      /* the board fills the viewport: no phone frame, the screen root is the page.
         display/grid-template-* live in board.css (base rule + the ≥720px
         override) so the desktop media query wins the cascade — this rule
         must not repeat them, or it would outrank board.css's media-scoped
         override by simple source order. */
      .screen {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        user-select: none;
      }
    </style>
  </head>
  <body>
    <main class="screen" id="screen">
      <canvas class="dots" id="dots" aria-hidden="true"></canvas>
      <div class="status">
        <div class="state"><span class="dot"></span><span id="state" role="button" tabindex="0" aria-expanded="false" aria-controls="setup">ready</span></div>
        <div class="clock" id="clock">0:00</div>
        <div class="corner">
          <span class="counters" id="counters"></span>
          <button class="earlierbtn" id="earlierbtn" aria-expanded="false" aria-controls="earlier">earlier</button>
        </div>
      </div>

      <div class="field" id="field"></div>
      <div class="heard" id="heard"></div>
      <p class="pinned" id="pinned" hidden></p>
      <section class="earlier" id="earlier" aria-label="Earlier soundings" hidden></section>
      <section class="earlier setup" id="setup" aria-label="How this is set up" hidden></section>
      <section class="wrap" id="wrap" aria-label="What I heard" aria-live="polite" hidden></section>

      <div class="controls">
        <button class="big" id="big" aria-label="Drop"><i></i></button>
        <button class="ctxopen" id="ctxopen">bring context</button>
        <div class="hint" id="hint"></div>
      </div>

      <aside class="panel-left" aria-label="Transcript">
        <div class="grip" aria-hidden="true"></div>
        <h2>Transcript</h2>
        <div class="transcript" id="transcript-d"></div>
      </aside>
      <aside class="panel-right" aria-label="Chart">
        <div class="grip" aria-hidden="true"></div>
        <h2>Chart</h2>
        <div class="chart">
          <div class="sub">what surfaced, and when · drag to replay · tap a name to follow it</div>
          <div class="surfaced" id="surfacedbox-d"></div>
          <svg id="chartsvg-d" viewBox="0 0 390 560" preserveAspectRatio="none" aria-label="Prominence of each concept over the sounding"></svg>
        </div>
      </aside>
      <button class="edge left" aria-expanded="false" aria-controls="transcript-d">transcript <kbd>T</kbd></button>
      <button class="edge right" aria-expanded="false" aria-controls="chartsvg-d">chart <kbd>C</kbd></button>
      <div class="popover" id="context-pop" hidden><div class="context" id="context-d"></div></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" data-detent="peek">
        <div class="grab" id="grab"><i></i></div>
        <div class="tabs" id="tabs" role="tablist">
          <button role="tab" data-tab="context" aria-selected="false">Context</button>
          <button role="tab" data-tab="transcript" aria-selected="true">Transcript</button>
          <button role="tab" data-tab="chart" aria-selected="false">Chart</button>
        </div>
        <div class="body" id="sheetbody">
          <div class="pane" data-pane="context">
            <div class="context" id="context"></div>
          </div>
          <div class="pane on" data-pane="transcript">
            <div class="transcript" id="transcript"></div>
          </div>
          <div class="pane" data-pane="chart">
            <div class="chart">
              <div class="sub">what surfaced, and when · drag to replay · tap a name to follow it</div>
              <div class="surfaced" id="surfacedbox"></div>
              <svg
                id="chartsvg"
                viewBox="0 0 390 560"
                preserveAspectRatio="none"
                aria-label="Prominence of each concept over the sounding"
              ></svg>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/ui/live.ts"></script>
  </body>
</html>
