<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sounding — live</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/ui/board/board.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page, var(--ground));
        color: var(--page-ink, var(--ink));
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* the board fills the viewport: no phone frame, the screen root is the page.
         display/grid-template-* live in board.css (base rule + the ≥720px
         override) so the desktop media query wins the cascade — this rule
         must not repeat them, or it would outrank board.css's media-scoped
         override by simple source order. */
      .screen {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        user-select: none;
      }
      .screen::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.55;
        background:
          radial-gradient(ellipse 60% 40% at 30% 35%, var(--ground-2) 0%, transparent 70%),
          radial-gradient(ellipse 50% 45% at 72% 62%, var(--ground-2) 0%, transparent 70%);
      }
    </style>
  </head>
  <body>
    <main class="screen" id="screen">
      <div class="status">
        <div class="state"><span class="dot"></span><span id="state" role="button" tabindex="0">ready</span></div>
        <div class="clock" id="clock">0:00</div>
        <div class="counters" id="counters"></div>
      </div>

      <div class="field" id="field"></div>
      <div class="heard" id="heard"></div>

      <div class="controls">
        <button class="big" id="big" aria-label="Drop"><i></i></button>
        <button class="ctxopen" id="ctxopen">bring context</button>
        <div class="hint" id="hint"></div>
      </div>

      <aside class="panel-left" aria-label="Transcript">
        <div class="grip" aria-hidden="true"></div>
        <h2>Transcript</h2>
        <div class="transcript" id="transcript-d"></div>
      </aside>
      <aside class="panel-right" aria-label="Chart">
        <div class="grip" aria-hidden="true"></div>
        <h2>Chart</h2>
        <div class="chart">
          <div class="sub">what surfaced, and when · drag to replay · tap a name to follow it</div>
          <div class="surfaced" id="surfacedbox-d"></div>
          <svg id="chartsvg-d" viewBox="0 0 390 560" preserveAspectRatio="none" aria-label="Prominence of each concept over the sounding"></svg>
        </div>
      </aside>
      <button class="edge left" aria-expanded="false" aria-controls="transcript-d">transcript <kbd>T</kbd></button>
      <button class="edge right" aria-expanded="false" aria-controls="chartsvg-d">chart <kbd>C</kbd></button>
      <div class="popover" id="context-pop" hidden><div class="context" id="context-d"></div></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" data-detent="peek">
        <div class="grab" id="grab"><i></i></div>
        <div class="tabs" id="tabs" role="tablist">
          <button role="tab" data-tab="context" aria-selected="false">Context</button>
          <button role="tab" data-tab="transcript" aria-selected="true">Transcript</button>
          <button role="tab" data-tab="chart" aria-selected="false">Chart</button>
        </div>
        <div class="body" id="sheetbody">
          <div class="pane" data-pane="context">
            <div class="context" id="context"></div>
          </div>
          <div class="pane on" data-pane="transcript">
            <div class="transcript" id="transcript"></div>
          </div>
          <div class="pane" data-pane="chart">
            <div class="chart">
              <div class="sub">what surfaced, and when · drag to replay · tap a name to follow it</div>
              <div class="surfaced" id="surfacedbox"></div>
              <svg
                id="chartsvg"
                viewBox="0 0 390 560"
                preserveAspectRatio="none"
                aria-label="Prominence of each concept over the sounding"
              ></svg>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/ui/live.ts"></script>
  </body>
</html>
